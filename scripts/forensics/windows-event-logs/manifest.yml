# Manifest for a single script folder under scripts/<category>/<script-name>/
# Copy this file as manifest.yml inside the script folder and fill it in.
# Required fields are uncommented. Optional fields are commented out — uncomment
# any that apply.

# --- Identity --------------------------------------------------------------

# Short identifier — must match the script folder name (kebab-case).
name: windows-event-logs

# Human-readable title for catalog display.
display_name: Export Windows Event Logs by Start Time

# One- to three-sentence description. Pulled into CATALOG.md.
summary: >
  Bulk-exports every populated Windows event log to a per-log .evtx file
  filtered to events created at or after a specified UTC start time, then
  compresses the result into a single ZIP. Designed for fast forensic
  capture of recent activity across the full local event-log landscape
  without grabbing unfiltered full logs.

# --- Classification --------------------------------------------------------

# Top-level folder under scripts/.
category: forensics

language: PowerShell

# Production = stable, in active use.
# Beta       = functional but rough edges; review before production use.
# WIP        = under development; expect breakage.
status: Beta

# --- Files in this folder --------------------------------------------------

# The script you invoke directly. For dot-sourced function files, name the
# file even though it is not "run" in the conventional sense.
entry_point: Get-targetedEvents.ps1

# Optional — list supporting scripts and what each one does. Omit for
# single-file scripts.
# components:
#   - name: <Helper-One.ps1>
#     description: <What this supporting script does.>

# Optional — non-script support files (config, lookup tables, etc.).
# support_files:
#   - name: whitelist.txt
#     description: One entry per line; lines starting with # are ignored.

# --- Runtime profile -------------------------------------------------------

requirements:
  os: Windows
  powershell: ">=5.1"
  software:
    - wevtutil.exe          # built into Windows
    - Compress-Archive      # built-in PowerShell cmdlet
  permissions:
    - Administrator rights are required to read most Windows event logs (Security log especially)
    - Write access to the chosen output directory and ZIP destination

# --- Data flow -------------------------------------------------------------

# Inputs the script consumes (parameters, files, API responses).
inputs:
  - -StartUtc     # ISO-8601 UTC timestamp; events at or after this time are exported (e.g. '2026-05-03T00:00:00.000Z')
  - -OutputRoot   # directory to write per-log .evtx files (created if missing)
  - -ZipPath      # path for the final ZIP archive (overwritten if it exists)

# Outputs the script produces (files, console output, return objects).
outputs:
  - One filtered .evtx file per populated event log in -OutputRoot (log-name characters that are illegal in filenames are replaced with underscores)
  - ZIP archive of all exported .evtx files at -ZipPath
  - Console line confirming the ZIP path

# --- Cross-reference -------------------------------------------------------

# Free-form tags used by CAPABILITY_MATRIX.md. Prefer kebab-case. Reuse
# existing tags where they fit; add new ones sparingly.
tags:
  - forensics
  - windows
  - event-logs
  - evtx
  - wevtutil
  - evidence-capture
  - powershell

# --- Optional metadata -----------------------------------------------------

# maintainer: <name or GitHub handle>
# created: <YYYY-MM-DD>
# updated: <YYYY-MM-DD>
# related:
#   - <other-script-name>
notes: >
  Reads from the local machine only — there is no remote-target parameter.
  Empty event logs are skipped to keep the output set small. wevtutil
  stderr is silenced (2>$null) so locked or access-denied logs do not
  pollute the console; if you need a complete capture log, remove that
  suppression. Administrator rights are required to read the Security
  log and other restricted channels.
